services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
      args:
        INSTALL_VOSK: "1"
        INSTALL_MOBILENET_SSD: "1"
    image: neuroad-api:local
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      NEUROAD_STORAGE_DIR: /data/neuroad/storage
      NEUROAD_DB_PATH: /data/neuroad/neuroad.db
      NEUROAD_WORKERS: "1"
      NEUROAD_MAX_UPLOAD_MB: "200"
      NEUROAD_MAX_SOURCE_SECONDS: "600"
      NEUROAD_MAX_ANALYSIS_SECONDS: "180"
      NEUROAD_MODEL_DIR: /data/neuroad/models
      NEUROAD_ENABLE_AUDIO_CLEANUP: "0"
      NEUROAD_AUDIO_CLEANUP_ENGINE: uvr
      NEUROAD_ENABLE_VAD: "0"
      NEUROAD_ENABLE_TRANSCRIPTION: "1"
      NEUROAD_TRANSCRIPTION_ENGINE: faster_whisper
      NEUROAD_ENABLE_OBJECT_DETECTION: "1"
      NEUROAD_OBJECT_DETECTION_ENGINE: yolo
      VOSK_MODEL_DIR: /opt/neuroad/models/vosk-model-small-en-us-0.15
      MOBILENET_SSD_GRAPH: /opt/neuroad/models/mobilenet-ssd/frozen_inference_graph.pb
      MOBILENET_SSD_CONFIG: /opt/neuroad/models/mobilenet-ssd/ssd_mobilenet_v1_coco.pbtxt
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      WHISPER_MODEL: small.en
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_WORD_TIMESTAMPS: "1"
      WHISPER_VAD_FILTER: "1"
      WHISPER_CPU_THREADS: "4"
      COMPARISON_MIN_VIDEOS: "2"
      COMPARISON_MAX_VIDEOS: "5"
      YOLO_MODEL: ${YOLO_MODEL:-/opt/neuroad/models/yolo11n.pt}
      NEUROAD_ENABLE_OCR: ${NEUROAD_ENABLE_OCR:-1}
      NEUROAD_YOLO_CONFIDENCE: ${NEUROAD_YOLO_CONFIDENCE:-0.25}
      NEUROAD_INSIGHT_WORKERS: ${NEUROAD_INSIGHT_WORKERS:-1}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      RAPIDAPI_HOST: ${RAPIDAPI_HOST:-}
      RAPIDAPI_URL: ${RAPIDAPI_URL:-}
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_ENDPOINT_ID: ${RUNPOD_ENDPOINT_ID:-}
      RUNPOD_BASE_URL: ${RUNPOD_BASE_URL:-}
      RUNPOD_MODEL: ${RUNPOD_MODEL:-neuroad-reasoner}
      RUNPOD_TIMEOUT_SECONDS: ${RUNPOD_TIMEOUT_SECONDS:-300}
      RUNPOD_MAX_TOKENS: ${RUNPOD_MAX_TOKENS:-2500}
      RUNPOD_MAX_RETRIES: ${RUNPOD_MAX_RETRIES:-2}
      NEUROAD_ENABLE_RUNPOD_INSIGHTS: ${NEUROAD_ENABLE_RUNPOD_INSIGHTS:-0}
      NEUROAD_REQUIRE_RUNPOD_INSIGHTS: ${NEUROAD_REQUIRE_RUNPOD_INSIGHTS:-0}
      POSTHOG_ENABLED: ${POSTHOG_ENABLED:-false}
      POSTHOG_PROJECT_TOKEN: ${POSTHOG_PROJECT_TOKEN:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      NEUROAD_ENVIRONMENT: ${NEUROAD_ENVIRONMENT:-development}
    volumes:
      - neuroad-api-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_POSTHOG_ENABLED: ${NEXT_PUBLIC_POSTHOG_ENABLED:-false}
        NEXT_PUBLIC_POSTHOG_TOKEN: ${NEXT_PUBLIC_POSTHOG_TOKEN:-}
        NEXT_PUBLIC_POSTHOG_HOST: ${NEXT_PUBLIC_POSTHOG_HOST:-https://us.i.posthog.com}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-development}
    image: neuroad-web:local
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  neuroad-api-data:
